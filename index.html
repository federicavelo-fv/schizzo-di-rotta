<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json">
<title>Schizzo di Rotta</title>
<style>
:root{--g:#173f35;--g2:#286454;--bg:#f4f6f5;--card:#fff;--line:#dce4e0;--txt:#1e2b27;--muted:#697773;--accent:#e9f1ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}
.appbar{background:linear-gradient(135deg,var(--g),#245b4c);color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}.appbar h1{margin:0;font-size:21px}.appbar p{margin:2px 0 0;font-size:12px;opacity:.8}
main{max-width:650px;margin:auto;padding:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--card);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 1px 5px #0000000d}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}button{border:0;border-radius:12px;padding:13px 10px;font-weight:700;font-size:14px;background:#fff;color:var(--g);box-shadow:0 1px 5px #0002}button.primary{background:var(--g2);color:#fff}.danger{color:#a23!important}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 7px #0000000d}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.badge{background:var(--g);color:#fff;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:800}.cardhead small{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fafcfa;padding:12px;font:inherit;font-size:16px;color:var(--txt)}textarea{resize:none;min-height:48px}.full{grid-column:1/-1}
.results{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.result{background:var(--accent);border-radius:10px;padding:8px}.result span{display:block;font-size:10px;color:var(--muted)}.result b{font-size:15px}.time{grid-column:1/-1;background:#eef6f2;border:1px solid #d4e6de}
.remove{background:#fff5f4;color:#a23;margin-top:10px;width:100%;box-shadow:none}.help{font-size:11px;color:var(--muted);line-height:1.4;margin:4px 2px 12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:30}.bottom button{width:100%;background:var(--g);color:#fff}
@media(min-width:700px){.bottom{position:static;border:0;background:transparent;padding:0;margin-bottom:12px}.bottom button{max-width:650px;display:block;margin:auto}.actions{grid-template-columns:repeat(4,1fr)}}@media print{.appbar,.actions,.bottom,.help,.remove{display:none}body{padding:0}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="appbar"><h1>Schizzo di Rotta</h1><p>1:25.000 · 1 mm sulla carta = 250 m</p></header><main>
<div class="summary"><div class="stat"><b id="sumTratti">0</b><span>TRATTI</span></div><div class="stat"><b id="sumDist">0 m</b><span>DISTANZA REALE</span></div><div class="stat"><b id="sumTime">0 min</b><span>TEMPO TOTALE</span></div></div>
<div class="actions"><button class="primary" onclick="addRow()">＋ Nuovo tratto</button><button onclick="window.print()">🖨 PDF / stampa</button><button onclick="exportCSV()">⬇ CSV</button><button class="danger" onclick="newRoute()">↺ Nuova rotta</button></div>
<p class="help">Compila quota di partenza, quota di arrivo, distanza sulla carta e azimut. I risultati vengono calcolati automaticamente e salvati sul dispositivo.</p><div id="rows"></div></main>
<div class="bottom"><button onclick="addRow()">＋ AGGIUNGI TRATTO</button></div>
<script>
const KEY="schizzo_rotta_pwa_v1";const n=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:NaN};const f=(x,d=1)=>Number.isFinite(x)?x.toFixed(d):"—";
const degFromPct=p=>Number.isFinite(p)?Math.atan(p/100)*180/Math.PI:NaN;function reciprocal(a){if(!Number.isFinite(a))return NaN;a=((a%360)+360)%360;return a<=180?a+180:a-180}
function addRow(d={}){const w=document.createElement("section");w.className="card";w.innerHTML=
`<div class="cardhead"><span class="badge">TRATTO <span class="num"></span></span><small>Calcolo automatico</small></div>
<div class="grid"><div><label>QUOTA DI PARTENZA · m</label><input class="start" type="number" inputmode="numeric" value="${d.start??""}" placeholder="es. 850"></div>
<div><label>QUOTA DI ARRIVO · m</label><input class="end" type="number" inputmode="numeric" value="${d.end??""}" placeholder="es. 1120"></div>
<div><label>DISTANZA SU CARTA · mm</label><input class="map" type="number" inputmode="decimal" step="0.1" min="0" value="${d.map??""}" placeholder="es. 18,5"></div>
<div><label>AZIMUT · °</label><input class="az" type="number" inputmode="numeric" min="0" max="360" value="${d.az??""}" placeholder="es. 125"></div>
<div class="full"><label>DESCRIZIONE DEL TRATTO</label><textarea class="desc" placeholder="es. sentiero nel bosco, cresta, ghiaione…">${d.desc??""}</textarea></div></div>
<div class="results"><div class="result"><span>DISLIVELLO</span><b class="diff">—</b></div><div class="result"><span>DISTANZA IN PIANO</span><b class="plan">—</b></div>
<div class="result"><span>DISTANZA REALE</span><b class="real">—</b></div><div class="result"><span>PENDENZA</span><b class="slope">—</b></div>
<div class="result"><span>PENDENZA IN GRADI</span><b class="deg">—</b></div><div class="result"><span>AZIMUT RECIPROCO</span><b class="recip">—</b></div>
<div class="result time"><span>TEMPO PARZIALE · TEMPO TOTALE</span><b class="times">—</b></div></div><button class="remove" onclick="removeRow(this)">Elimina tratto</button>`;
document.getElementById("rows").appendChild(w);w.querySelectorAll("input,textarea").forEach(x=>x.addEventListener("input",calc));calc()}
function removeRow(b){b.closest(".card").remove();calc()}function calc(){let total=0,dist=0,idx=0;
document.querySelectorAll(".card").forEach(c=>{idx++;c.querySelector(".num").textContent=idx;const s=n(c.querySelector(".start").value),e=n(c.querySelector(".end").value),mm=n(c.querySelector(".map").value),az=n(c.querySelector(".az").value);
const diff=Number.isFinite(s)&&Number.isFinite(e)?e-s:NaN,plan=Number.isFinite(mm)?mm*250:NaN,real=Number.isFinite(plan)&&Number.isFinite(diff)?Math.sqrt(plan*plan+diff*diff):NaN,pct=Number.isFinite(diff)&&Number.isFinite(plan)&&plan?diff*100/plan:NaN,deg=degFromPct(pct);
const td=Number.isFinite(real)?real/1000*15:NaN,te=Number.isFinite(diff)?Math.abs(diff)/100*20:NaN,part=Number.isFinite(td)&&Number.isFinite(te)?Math.max(td,te)+Math.min(td,te)/2:NaN;if(Number.isFinite(part))total+=part;if(Number.isFinite(real))dist+=real;
c.querySelector(".diff").textContent=Number.isFinite(diff)?f(diff,0)+" m":"—";c.querySelector(".plan").textContent=Number.isFinite(plan)?f(plan,1)+" m":"—";c.querySelector(".real").textContent=Number.isFinite(real)?f(real,1)+" m":"—";c.querySelector(".slope").textContent=Number.isFinite(pct)?f(pct,2)+" %":"—";c.querySelector(".deg").textContent=Number.isFinite(deg)?f(deg,1)+"°":"—";c.querySelector(".recip").textContent=Number.isFinite(az)?f(reciprocal(az),0)+"°":"—";c.querySelector(".times").textContent=Number.isFinite(part)?f(part,1)+" min · "+f(total,1)+" min":"—"});document.getElementById("sumTratti").textContent=idx;document.getElementById("sumDist").textContent=f(dist,0)+" m";document.getElementById("sumTime").textContent=f(total,1)+" min";save()}
function save(){localStorage.setItem(KEY,JSON.stringify([...document.querySelectorAll(".card")].map(c=>({start:c.querySelector(".start").value,end:c.querySelector(".end").value,map:c.querySelector(".map").value,az:c.querySelector(".az").value,desc:c.querySelector(".desc").value}))))}
function load(){let a=[];try{a=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}if(a.length)a.forEach(addRow);else addRow()}
function newRoute(){if(confirm("Cancellare la rotta e iniziarne una nuova?")){localStorage.removeItem(KEY);document.getElementById("rows").innerHTML="";addRow()}}
function exportCSV(){const out=[["Tratto","Quota partenza","Quota arrivo","Descrizione","Dislivello","Distanza carta mm","Distanza piano","Distanza reale","Pendenza %","Pendenza gradi","Tempo parziale","Tempo totale","Azimut","Azimut reciproco"]];document.querySelectorAll(".card").forEach((c,i)=>out.push([i+1,c.querySelector(".start").value,c.querySelector(".end").value,c.querySelector(".desc").value,c.querySelector(".diff").textContent,c.querySelector(".map").value,c.querySelector(".plan").textContent,c.querySelector(".real").textContent,c.querySelector(".slope").textContent,c.querySelector(".deg").textContent,c.querySelector(".times").textContent.split(" · ")[0],c.querySelector(".times").textContent.split(" · ")[1],c.querySelector(".az").value,c.querySelector(".recip").textContent]));const blob=new Blob(["﻿"+out.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="schizzo_di_rotta.csv";a.click()}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));load();
</script></body></html>
